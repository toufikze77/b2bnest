name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm only: bun.lock points at Lovable's private registry.
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint (may not exceed .eslint-baseline)
        run: node scripts/check-lint-baseline.mjs
      - name: Tests
        run: npx vitest run
      # Uses the committed public .env.production; no secrets are needed.
      - name: Build
        run: npm run build
